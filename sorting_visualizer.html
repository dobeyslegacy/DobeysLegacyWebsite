<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SORT.PY · Sorting Visualizer</title>
<style>
:root{
  color-scheme:dark;
  --bg:#020a06;--panel:rgba(2,16,9,.84);--line:#0d4a2b;--g:#00ff7f;--gd:#0a7a45;
  --txt:#c9ffe0;--mute:#6fb08a;--y:#ffd43b;--b:#61afef;--r:#ff4d6d;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);min-height:100vh;
  font-family:ui-monospace,"SF Mono",Consolas,"Courier New",monospace}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.55}
main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:22px 14px 40px}
header{margin-bottom:16px}
.glitch{position:relative;display:inline-block;margin:0;font-size:clamp(34px,10vw,58px);color:var(--g);
  letter-spacing:.04em;text-shadow:0 0 14px rgba(0,255,127,.55)}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;clip-path:inset(0 0 100% 0)}
.glitch::before{color:var(--r);animation:g1 3.4s infinite steps(1)}
.glitch::after{color:var(--b);animation:g2 3.4s infinite steps(1)}
@keyframes g1{0%,90%,100%{clip-path:inset(0 0 100% 0)}91%{clip-path:inset(15% 0 55% 0);transform:translate(-3px,0)}95%{clip-path:inset(62% 0 8% 0);transform:translate(3px,0)}}
@keyframes g2{0%,92%,100%{clip-path:inset(0 0 100% 0)}93%{clip-path:inset(45% 0 30% 0);transform:translate(3px,0)}97%{clip-path:inset(5% 0 75% 0);transform:translate(-3px,0)}}
.sub{margin:6px 0 0;color:var(--mute);font-size:14px}
.sub::after{content:"_";color:var(--g);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;
  box-shadow:0 0 20px rgba(0,255,127,.08);backdrop-filter:blur(2px)}
.lbl{display:block;color:var(--mute);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
input[type=text],select{font:inherit;font-size:16px;background:#00130a;color:var(--g);border:1px solid var(--gd);border-radius:6px;padding:10px;min-height:44px}
input[type=text]{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
button{font:inherit;font-size:15px;min-height:44px;padding:8px 14px;background:#04210f;color:var(--g);
  border:1px solid var(--gd);border-radius:6px;cursor:pointer;transition:box-shadow .2s,background .2s}
button:hover{box-shadow:0 0 12px rgba(0,255,127,.45)}
button.on{background:var(--g);color:#00140a;font-weight:700}
button.go{background:var(--y);border-color:var(--y);color:#241c00;font-weight:700;flex:1;min-width:120px}
.seg{display:inline-flex}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0;border-left:0}
.spd{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px;flex:1;min-width:150px}
.spd input{flex:1;accent-color:var(--g)}
#bars{position:relative;height:clamp(200px,38vh,300px);border-bottom:1px solid var(--line);--dur:400ms}
.bar{position:absolute;bottom:0;left:calc(var(--i)*100%/var(--n) + 3px);width:calc(100%/var(--n) - 6px);height:var(--h);
  display:flex;justify-content:center;align-items:flex-start;padding-top:4px;font-weight:700;color:var(--txt);
  font-size:clamp(9px,calc(100vw/var(--n)/3.2),16px);transform-origin:bottom;
  background:linear-gradient(180deg,rgba(0,255,127,.3),rgba(0,255,127,.06));border:1px solid var(--g);border-bottom:0;border-radius:5px 5px 0 0;
  transition:left var(--dur) cubic-bezier(.4,0,.2,1),background .2s,box-shadow .2s,border-color .2s;
  animation:rise .6s both;animation-delay:calc(var(--k)*45ms)}
@keyframes rise{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.bar.sorted,.bar.done{border-color:#7dffbf;background:linear-gradient(180deg,rgba(0,255,127,.7),rgba(0,255,127,.22));box-shadow:0 0 10px rgba(0,255,127,.45)}
.bar.done{animation:wave .7s ease both;animation-delay:calc(var(--i)*70ms)}
@keyframes wave{0%{transform:scaleY(1)}40%{transform:scaleY(1.07)}100%{transform:scaleY(1)}}
.bar.min{border-color:var(--b);background:linear-gradient(180deg,rgba(97,175,239,.6),rgba(97,175,239,.15));box-shadow:0 0 14px rgba(97,175,239,.6)}
.bar.cmp{border-color:var(--y);background:linear-gradient(180deg,rgba(255,212,59,.6),rgba(255,212,59,.14));box-shadow:0 0 14px rgba(255,212,59,.6)}
.bar.swp{border-color:var(--r);background:linear-gradient(180deg,rgba(255,77,109,.65),rgba(255,77,109,.15));box-shadow:0 0 16px rgba(255,77,109,.65)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px;color:var(--mute)}
.stats b{color:var(--txt)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.two{display:grid;grid-template-columns:1fr;gap:14px}
.two .panel{margin:0}
@media(min-width:760px){.two{grid-template-columns:1.15fr 1fr}}
pre{margin:0;overflow-x:auto;font:inherit;font-size:12.5px;line-height:1.65}
.ln{display:block;white-space:pre;padding:0 6px;border-left:3px solid transparent}
.ln.act{background:rgba(255,212,59,.14);border-left-color:var(--y);color:#fff}
.k{font-style:normal;color:var(--b)}.f{font-style:normal;color:var(--y)}
#log{height:205px;overflow-y:auto;font-size:13px;line-height:1.55}
#log .p{color:var(--y)}#log .ok{color:var(--g);font-weight:700}#log .er{color:var(--r)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main>
  <header>
    <h1 class="glitch" data-t="SORT.PY">SORT.PY</h1>
    <p class="sub">// Chapter 12: Bubble Sort and Selection Sort, live</p>
  </header>

  <section class="panel">
    <label class="lbl" for="inp">numbers = [ ]</label>
    <input type="text" id="inp" value="23, 12, 7, 11, 4" autocomplete="off" spellcheck="false" aria-label="Numbers separated by commas">
    <div class="row">
      <button id="load">Load</button>
      <button id="rand">Random</button>
      <select id="cnt" aria-label="How many random numbers"><option>5</option><option>8</option><option selected>10</option><option>12</option><option>15</option></select>
      <div class="seg" role="group" aria-label="Algorithm">
        <button data-algo="bubble" class="on" aria-pressed="true">Bubble</button>
        <button data-algo="selection" aria-pressed="false">Selection</button>
      </div>
      <div class="seg" role="group" aria-label="Order">
        <button data-ord="asc" class="on" aria-pressed="true">&#8593; Asc</button>
        <button data-ord="desc" aria-pressed="false">&#8595; Desc</button>
      </div>
    </div>
    <div class="row">
      <button id="run" class="go">&#9654; Start</button>
      <button id="step">&#9197; Step</button>
      <button id="rst">&#8634; Reset</button>
      <label class="spd">Speed <input type="range" id="spd" min="1" max="10" value="6" aria-label="Speed"></label>
    </div>
  </section>

  <section class="panel">
    <div id="bars" role="img" aria-label="Bars showing the numbers being sorted"></div>
    <div class="stats">
      <span>Pass <b id="sp">0</b></span><span>Comparisons <b id="sc">0</b></span><span>Swaps <b id="ss">0</b></span>
      <span class="lg"><i style="background:var(--y)"></i>compare</span>
      <span class="lg"><i style="background:var(--r)"></i>swap</span>
      <span class="lg"><i style="background:var(--b)"></i>min</span>
      <span class="lg"><i style="background:var(--g)"></i>sorted</span>
    </div>
  </section>

  <div class="two">
    <section class="panel"><span class="lbl">Python code</span><pre id="code"></pre></section>
    <section class="panel"><span class="lbl">IDLE Shell</span><div id="log"></div></section>
  </div>
</main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

/* ---------- Matrix 0/1 rain ---------- */
(function(){
  const c=$('#rain'),x=c.getContext('2d'),fs=16,ch='0101010101{}[]()=<>:#';
  let w,h,cols,drops;
  function size(){const d=window.devicePixelRatio||1;w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);
    cols=Math.ceil(w/fs);drops=Array.from({length:cols},()=>-Math.floor(Math.random()*40));}
  function step(){
    x.fillStyle='rgba(2,10,6,.12)';x.fillRect(0,0,w,h);x.font=fs+'px monospace';
    for(let i=0;i<cols;i++){
      const y=drops[i]*fs;
      x.fillStyle=drops[i]>0&&Math.random()>.97?'#d6ffe9':'#00c85a';
      if(drops[i]>0)x.fillText(ch[Math.floor(Math.random()*ch.length)],i*fs,y);
      if(y>h&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
  }
  size();addEventListener('resize',size);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){for(let k=0;k<90;k++)step();}
  else{let last=0;(function loop(t){if(t-last>55){last=t;step();}requestAnimationFrame(loop);})(0);}
})();

/* ---------- Sorting ---------- */
const CODE={
 bubble:['def bubble_sort(LIST, n):','    for i in range(n - 1):','        for j in range(0, n - i - 1):','            if LIST[j] > LIST[j + 1]:','                LIST[j], LIST[j + 1] = LIST[j + 1], LIST[j]','    return LIST'],
 selection:['def selection_sort(LIST, n):','    for i in range(n - 1):','        min_index = i','        for j in range(i + 1, n):','            if LIST[j] < LIST[min_index]:','                min_index = j','        LIST[i], LIST[min_index] = LIST[min_index], LIST[i]','    return LIST']
};
let orig=[23,12,7,11,4],arr=[],els={},algo='bubble',desc=false,gen=null,running=false,timer=0,sortedSet=new Set(),hl={},st={p:0,c:0,s:0},done=false;
const after=(a,b)=>desc?a<b:a>b;
const delay=()=>1050-(+$('#spd').value)*100;

function* bubble(a){
  const n=a.length;
  for(let i=0;i<n-1;i++){
    yield {t:'pass',ln:1,p:i+1,msg:'Pass '+(i+1)};
    for(let j=0;j<n-i-1;j++){
      yield {t:'cmp',ln:3,i:j,j:j+1,msg:'compare '+a[j].v+' and '+a[j+1].v};
      if(after(a[j].v,a[j+1].v)){[a[j],a[j+1]]=[a[j+1],a[j]];yield {t:'swap',ln:4,i:j,j:j+1,msg:'swap -> '+a[j].v+', '+a[j+1].v};}
    }
    yield {t:'fix',k:n-i-1};
  }
  yield {t:'fix',k:0};
  yield {t:'done'};
}
function* selection(a){
  const n=a.length;
  for(let i=0;i<n-1;i++){
    let m=i;
    yield {t:'pass',ln:2,p:i+1,m,msg:'Pass '+(i+1)+': assume '+a[i].v+' is the '+(desc?'largest':'smallest')};
    for(let j=i+1;j<n;j++){
      yield {t:'cmp',ln:4,i:j,m,msg:'compare '+a[j].v+' with '+a[m].v};
      if(after(a[m].v,a[j].v)){m=j;yield {t:'min',ln:5,m,msg:'new '+(desc?'max':'min')+' = '+a[m].v};}
    }
    if(m!==i){[a[i],a[m]]=[a[m],a[i]];yield {t:'swap',ln:6,i,j:m,msg:'swap -> '+a[i].v+' goes to position '+i};}
    else yield {t:'noswap',ln:6,msg:a[i].v+' already in place, no exchange'};
    yield {t:'fix',k:i};
  }
  yield {t:'fix',k:n-1};
  yield {t:'done'};
}

function log(msg,cls){
  const d=document.createElement('div');d.className=cls||'';
  const p=document.createElement('span');p.className='p';p.textContent='>>> ';
  d.append(p,document.createTextNode(msg));
  const L=$('#log');L.append(d);while(L.children.length>80)L.firstChild.remove();L.scrollTop=L.scrollHeight;
}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function drawCode(){
  const lines=CODE[algo].slice(),ci=algo==='bubble'?3:4;
  if(desc)lines[ci]=lines[ci].includes(' > ')?lines[ci].replace(' > ',' < '):lines[ci].replace(' < ',' > ');
  $('#code').innerHTML=lines.map(l=>'<span class="ln">'+esc(l).replace(/\b(def|for|in|if|return)\b/g,'<i class="k">$1</i>').replace(/\brange\b/g,'<i class="f">range</i>')+'</span>').join('');
}
const act=n=>$$('#code .ln').forEach((s,i)=>s.classList.toggle('act',i===n));
function stats(){$('#sp').textContent=st.p;$('#sc').textContent=st.c;$('#ss').textContent=st.s;}
function setBtns(){$('#run').innerHTML=running?'&#9208; Pause':(gen&&!done?'&#9654; Resume':'&#9654; Start');}

function render(){
  arr.forEach((o,k)=>{
    const e=els[o.id];e.style.setProperty('--i',k);
    let c='bar';
    if(done)c+=' done';else if(sortedSet.has(k))c+=' sorted';
    if(hl.min===k)c+=' min';
    if(hl.cmp&&hl.cmp.includes(k))c+=' cmp';
    if(hl.swap&&hl.swap.includes(k))c+=' swp';
    e.className=c;
  });
}
function stop(){running=false;clearTimeout(timer);}
function reset(){
  stop();gen=null;done=false;sortedSet=new Set();hl={};st={p:0,c:0,s:0};
  arr=orig.map((v,i)=>({id:i,v}));
  const mx=Math.max(...orig,1),B=$('#bars');B.innerHTML='';els={};B.style.setProperty('--n',arr.length);
  arr.forEach((o,k)=>{
    const e=document.createElement('div');e.className='bar';
    e.style.setProperty('--h',Math.max(9,o.v/mx*100)+'%');e.style.setProperty('--k',k);
    e.textContent=o.v;B.append(e);els[o.id]=e;
  });
  drawCode();act(-1);render();stats();setBtns();
}
function apply(e){
  hl={};
  if(e.t==='cmp'){hl.cmp=[e.i,e.j].filter(v=>v!==undefined);st.c++;}
  else if(e.t==='swap'){hl.swap=[e.i,e.j];st.s++;}
  if(e.m!==undefined&&e.t!=='swap')hl.min=e.m;
  if(e.t==='pass')st.p=e.p;
  if(e.t==='fix')sortedSet.add(e.k);
  if(e.ln!==undefined)act(e.ln);
  if(e.t==='done'){done=true;act(CODE[algo].length-1);log('Sorted list: ['+arr.map(o=>o.v).join(', ')+']','ok');}
  else if(e.msg)log(e.msg);
  stats();
}
function advance(){
  if(!gen){gen=(algo==='bubble'?bubble:selection)(arr);log(algo+'_sort(numbers, '+arr.length+')   # '+(desc?'descending':'ascending'));}
  let r;
  do{r=gen.next();if(r.done)return false;apply(r.value);}while(r.value.t==='fix');
  return !done;
}
function tick(){
  if(!running)return;
  const ms=delay();$('#bars').style.setProperty('--dur',Math.min(420,ms*.85)+'ms');
  const more=advance();render();
  if(more)timer=setTimeout(tick,ms);else{running=false;setBtns();}
}
function parse(){
  const raw=$('#inp').value.trim();
  if(!raw){log('ValueError: enter some numbers','er');return null;}
  const v=raw.split(/[\s,]+/).filter(Boolean).map(Number);
  if(v.some(n=>!Number.isInteger(n)||n<0||n>999)){log('ValueError: use whole numbers from 0 to 999','er');return null;}
  if(v.length<2||v.length>15){log('Need 2 to 15 numbers','er');return null;}
  return v;
}
function load(v){orig=v;reset();log('numbers = ['+v.join(', ')+']');}

$('#load').onclick=()=>{const v=parse();if(v)load(v);};
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=parse();if(v)load(v);}});
$('#rand').onclick=()=>{
  const n=+$('#cnt').value,s=new Set();
  while(s.size<n)s.add(1+Math.floor(Math.random()*99));
  const v=[...s];$('#inp').value=v.join(', ');load(v);
};
$('#run').onclick=()=>{if(running){stop();setBtns();return;}if(done)reset();running=true;setBtns();tick();};
$('#step').onclick=()=>{if(done)reset();stop();$('#bars').style.setProperty('--dur','350ms');advance();render();setBtns();};
$('#rst').onclick=()=>{reset();log('numbers = ['+orig.join(', ')+']');};
$$('[data-algo]').forEach(b=>b.onclick=()=>{algo=b.dataset.algo;$$('[data-algo]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b);});reset();});
$$('[data-ord]').forEach(b=>b.onclick=()=>{desc=b.dataset.ord==='desc';$$('[data-ord]').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b);});reset();});

reset();
log('Python 3.10.12: sorting visualizer ready');
log('numbers = ['+orig.join(', ')+']');
</script>
</body>
</html>
